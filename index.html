// ★ visualViewport 対応：スマホの実際の表示領域に合わせる
function getViewSize(){
  if(window.visualViewport){
    return { w: Math.round(window.visualViewport.width),
             h: Math.round(window.visualViewport.height) };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}
function resize(){
  const v = getViewSize();
  W = cv.width = v.w;
  H = cv.height = v.h;
  cv.style.width = v.w + 'px';
  cv.style.height = v.h + 'px';
  groundY = Math.round(H * 0.72);
}
window.addEventListener('resize', resize);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
resize();

// ★ ダブルタップズーム・ピンチズーム完全防止
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouchEnd < 350){
    e.preventDefault();  // ダブルタップズーム阻止
  }
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener('touchmove', e => {
  if(e.touches.length > 1) e.preventDefault();  // ピンチズーム阻止
}, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ------- 状態 -------
let state = 'title';   // title / play / dying / over
let score = 0, hi = 0, newHigh = false;
let deadRot = 0, deadTimer = 0;
try { hi = parseInt(localStorage.getItem('hamHi')) || 0; } catch(e){}
document.getElementById('hs').textContent = hi;

const TS = 44;
const SPEED = 6, GRAV = 0.85, JUMP_V = -15.5;
const homeX = () => Math.max(60, Math.round(W*0.16));
const P = { x:70, y:0, vy:0, w:40, h:40, ground:true };

let cols = [];
let items = [];
let pops = [], parts = [], clouds = [];
let genX = 0, curLvl = 0, flatRun = 0, safeGap = 0;
let animT = 0, fwTimer = 0;

for(let i=0;i<5;i++) clouds.push({x:Math.random()*2000, y:30+Math.random()*110, s:0.3+Math.random()*0.5, r:26+Math.random()*24});

const rnd18 = () => 1 + Math.floor(Math.random()*8);
const pickScoreN = () => (Math.random() < 0.04 ? 114514 : rnd18()); // まれに114514コイン

// ------- 地形生成 -------
function pushCol(lvl){ cols.push({x:genX, lvl:lvl}); genX += TS; }
function genNext(){
  const r = Math.random();
  if(flatRun >= 2 && safeGap <= 0){
    if(r < 0.15 && curLvl < 3){
      curLvl++;
      pushCol(curLvl);
      flatRun = 1; safeGap = 2;
      return;
    }
    if(r < 0.29 && curLvl > 0){
      curLvl -= (curLvl > 1 && Math.random() < 0.5) ? 2 : 1;
      pushCol(curLvl);
      flatRun = 1; safeGap = 1;
      return;
    }
    if(r < 0.36){
      const gw = Math.random() < 0.3 ? 3 : 2;
      for(let i = 0; i < gw; i++){
        if(Math.random() < 0.6)
          items.push({x:genX+TS/2, y:groundY-curLvl*TS-TS*1.4, n:pickScoreN()});
        cols.push({x:genX, lvl:-1}); genX += TS;
      }
      if(curLvl > 0 && Math.random() < 0.5) curLvl--;
      flatRun = 0; safeGap = 3;
      return;
    }
  }
  pushCol(curLvl);
  flatRun++;
  if(safeGap > 0) safeGap--;
  const cx = genX - TS/2, t = groundY - curLvl*TS;
  if(safeGap <= 0 && flatRun >= 3 && Math.random() < 0.09){
    if(Math.random() < 0.5){
      items.push({x:cx, y:t - 22, n:9});
    } else {
      items.push({x:cx, y:Math.max(70, t - TS*2.5), n:9});
    }
    safeGap = 5;
  } else if(Math.random() < 0.22){
    if(Math.random() < 0.5){
      items.push({x:cx, y:t - 24, n:pickScoreN()});
    } else {
      items.push({x:cx, y:Math.max(70, t - TS*(1.6 + Math.random()*1.0)), n:pickScoreN()});
    }
  }
}

function reset(){
  score = 0; newHigh = false;
  cols = []; items = []; pops = []; parts = [];
  genX = -TS; curLvl = 0; flatRun = 0;
  safeGap = Math.ceil((W*0.55)/TS);
  while(genX < W + TS*3) genNext();
  P.x = homeX(); P.y = groundY; P.vy = 0; P.ground = true;
  deadRot = 0; deadTimer = 0;
  document.getElementById('sc').textContent = 0;
}
reset();

// ------- BGM（mp3ループ再生） -------
const BGM_VOLUME = 0.3;   // ★ ここで音量調整（0.0〜1.0）
const bgm = document.getElementById('bgm');
bgm.volume = BGM_VOLUME;
function startBGM(){
  bgm.currentTime = 0;
  const p = bgm.play();
  if(p && p.catch) p.catch(()=>{});
}
function stopBGM(){ bgm.pause(); }

// ------- 効果音（WebAudio） -------
let AC = null;
function initAudio(){
  try {
    if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
}
function tone(f,t,d,type,v){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+d);
}
function sfxJump(){
  if(!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='square'; o.frequency.setValueAtTime(300,t);
  o.frequency.exponentialRampToValueAtTime(650,t+0.12);
  g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.15);
}
function sfxCoin(){
  if(!AC) return;
  const t = AC.currentTime;
  tone(950,t,0.08,'square',0.07);
  tone(1420,t+0.07,0.12,'square',0.07);
}
function sfxOver(){
  if(!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(400,t);
  o.frequency.exponentialRampToValueAtTime(70,t+0.6);
  g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.65);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.65);
}
function sfxFw(){
  if(!AC) return;
  tone(200+Math.random()*300, AC.currentTime, 0.25, 'triangle', 0.05);
}

// ------- 操作 -------
function jump(){
  if(state !== 'play') return;
  if(P.ground){ P.vy = JUMP_V; P.ground = false; sfxJump(); }
}
document.addEventListener('touchstart', e => {
  if(e.target.closest('button')) return;
  e.preventDefault();
  jump();
}, {passive:false});
document.addEventListener('mousedown', e => {
  if(e.target.closest('button')) return;
  jump();
});
document.addEventListener('keydown', e => { if(e.code==='Space'){ e.preventDefault(); jump(); } });

function startGame(){
  initAudio(); startBGM(); resize(); reset();
  state = 'play';
  document.getElementById('titleScr').classList.add('hidden');
  document.getElementById('overScr').classList.add('hidden');
}
function bindTap(el, fn){
  let handled = false;
  el.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    handled = true; fn();
    setTimeout(()=>{ handled = false; }, 500);
  }, {passive:false});
  el.addEventListener('click', e => {
    e.stopPropagation();
    if(handled) return;
    fn();
  });
}
bindTap(document.getElementById('btnStart'), startGame);
bindTap(document.getElementById('btnRetry'), startGame);

// ★ 「9」に当たった時：目バツ＆ひっくり返る演出
function startDying(){
  if(state !== 'play') return;
  state = 'dying';
  stopBGM(); sfxOver();
  P.vy = -13;          // ポーンと跳ね上がる
  deadRot = 0; deadTimer = 0;
  P.ground = false;
}
function showGameOver(){
  state = 'over';
  if(score > hi){
    hi = score; newHigh = true;
    try { localStorage.setItem('hamHi', hi); } catch(e){}
  }
  document.getElementById('finalSc').textContent = score;
  document.getElementById('finalHi').textContent = hi;
  document.getElementById('hs').textContent = hi;
  document.getElementById('newRec').style.display = newHigh ? 'block' : 'none';
  document.getElementById('overScr').classList.remove('hidden');
  fwTimer = 0;
}
function die(){   // 穴落ちなど即ゲームオーバー用
  if(state !== 'play') return;
  stopBGM(); sfxOver();
  showGameOver();
}

// ------- パーティクル -------
function burst(x, y, colors, n, spd){
  for(let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.3;
    const s = spd*(0.5+Math.random()*0.8);
    parts.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, c:colors[Math.floor(Math.random()*colors.length)]});
  }
}
function firework(){
  const x = W*0.1 + Math.random()*W*0.8;
  const y = H*0.12 + Math.random()*H*0.35;
  const hues = ['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff4dff','#ffffff'];
  burst(x, y, [hues[Math.floor(Math.random()*hues.length)], '#fff'], 36, 4);
  sfxFw();
}
function rectHit(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ------- 描画部品 -------
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
// ★ 走る男性（クロマキー処理済み実写スプライト。dead=true で回転しながら落下）
function drawRunner(x, footY, frame, air, dead, rot){
  if(!runnerImg.complete || runnerImg.naturalWidth === 0) return;
  const dw = RUN_FW * RUN_SCALE, dh = RUN_FH * RUN_SCALE;
  const cx = x + P.w/2;
  ctx.save();
  if(dead){
    ctx.translate(cx, footY - dh*0.42);
    ctx.rotate(rot || 0);
    ctx.drawImage(runnerImg, frame*RUN_FW, 0, RUN_FW, RUN_FH,
                  -dw*0.5, -dh*0.5, dw, dh);
  } else {
    ctx.translate(cx, footY);
    if(air) ctx.translate(0, -3);
    ctx.drawImage(runnerImg, frame*RUN_FW, 0, RUN_FW, RUN_FH,
                  -dw*0.5, -dh, dw, dh);
  }
  ctx.restore();
}
function drawTerrain(){
  for(const c of cols){
    if(c.lvl < 0) continue;
    const t = groundY - c.lvl*TS;
    for(let y = t + TS; y < H; y += TS){
      ctx.fillStyle = '#9b6a35';
      ctx.fillRect(c.x, y, TS, TS);
      ctx.strokeStyle = '#7d5227'; ctx.lineWidth = 2;
      ctx.strokeRect(c.x+1, y+1, TS-2, TS-2);
    }
    ctx.fillStyle = '#b57b3a';
    rrect(c.x+1, t+1, TS-2, TS-2, 6); ctx.fill();
    ctx.strokeStyle = '#8a5a24';
    ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#5cb84e';
    rrect(c.x+1, t+1, TS-2, 13, 6); ctx.fill();
    ctx.fillStyle = '#4a9c3e';
    ctx.beginPath();
    ctx.arc(c.x+10, t+13, 4, 0, Math.PI);
    ctx.arc(c.x+22, t+13, 4, 0, Math.PI);
    ctx.arc(c.x+34, t+13, 4, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = 'rgba(122,77,30,0.5)';
    ctx.beginPath(); ctx.arc(c.x+13, t+27, 2.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x+30, t+34, 2.2, 0, 7); ctx.fill();
  }
}
function drawItems(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const it of items){
    const y = it.y + Math.sin(animT*0.08 + it.x*0.05)*3;
    if(it.n === 9){
      if(deathImg.complete && deathImg.naturalWidth){
        const rot = Math.sin(animT*0.05 + it.x*0.03)*0.06;
        ctx.save();
        ctx.translate(it.x, y);
        ctx.rotate(rot);
        ctx.drawImage(deathImg, -DEATH_W/2, -DEATH_H/2, DEATH_W, DEATH_H);
        ctx.restore();
      }
    } else if(it.n === 114514){
      if(coinImg.complete && coinImg.naturalWidth){
        const bob = Math.sin(animT*0.1 + it.x*0.08)*2;
        ctx.save();
        ctx.shadowColor = 'rgba(255,210,60,0.85)';
        ctx.shadowBlur = 14;
        ctx.drawImage(coinImg, it.x-COIN_SIZE/2, y-COIN_SIZE/2+bob, COIN_SIZE, COIN_SIZE);
        ctx.restore();
      }
    } else {
      ctx.fillStyle = '#ffd23e';
      ctx.beginPath(); ctx.arc(it.x, y, 15, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c99400'; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(it.x, y, 10.5, 0, 7); ctx.stroke();
      ctx.fillStyle = '#7a5b00';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText(it.n, it.x, y+1);
    }
  }
}

// ------- メインループ -------
let last = performance.now();
function loop(now){
  let dt = Math.min(2.5, Math.max(0.1, (now - last)/16.667));
  last = now;
  animT += dt;

  clouds.forEach(c => { c.x -= c.s*dt; if(c.x < -120) c.x = W + 120; });

  if(state === 'play'){
    const dx = SPEED*dt;
    cols.forEach(c => c.x -= dx);
    items.forEach(it => it.x -= dx);
    genX -= dx;
    cols = cols.filter(c => c.x > -TS*2);
    items = items.filter(it => it.x > -TS*2);
    while(genX < W + TS*3) genNext();

    const prevY = P.y;
    P.vy += GRAV*dt;
    P.y += P.vy*dt;

    let pushed = false;
    for(const c of cols){
      if(c.lvl < 0) continue;
      const t = groundY - c.lvl*TS;
      if(prevY > t + 3 && P.y > t + 3 &&
         P.x + P.w > c.x + 2 && P.x < c.x + TS - 2){
        P.x = Math.min(P.x, c.x - P.w + 2);
        pushed = true;
      }
    }
    if(P.x + P.w < 8){ die(); }
    if(!pushed && P.x < homeX()) P.x = Math.min(homeX(), P.x + 1.6*dt);

    let top = Infinity;
    for(const c of cols){
      if(c.lvl < 0) continue;
      if(P.x + P.w - 8 > c.x && P.x + 8 < c.x + TS){
        const t = groundY - c.lvl*TS;
        if(t < top) top = t;
      }
    }
    if(top < Infinity && prevY <= top + 3 && P.y >= top && P.vy >= 0){
      P.y = top; P.vy = 0; P.ground = true;
    } else P.ground = false;
    if(P.y - P.h > H + 40){ die(); }

    if(state === 'play'){
      const pr = {x:P.x+7, y:P.y-P.h+6, w:P.w-14, h:P.h-8};
      for(let i = items.length-1; i >= 0; i--){
        const it = items[i];
        let hw = 14, hh = 14;
        if(it.n === 9){ hw = DEATH_W*0.42; hh = DEATH_H*0.46; }
        else if(it.n === 114514){ hw = COIN_SIZE*0.5; hh = COIN_SIZE*0.5; }
        if(rectHit(pr, {x:it.x-hw, y:it.y-hh, w:hw*2, h:hh*2})){
          if(it.n === 9){ startDying(); break; }
          score += it.n;
          document.getElementById('sc').textContent = score;
          pops.push({x:it.x, y:it.y-10, t:'+'+it.n, life:1});
          if(it.n === 114514){
            burst(it.x, it.y, ['#ffd740','#fff59d','#ffe082','#fff'], 28, 4.2);
          } else {
            burst(it.x, it.y, ['#ffd740','#fff59d','#ffab40'], 10, 2.5);
          }
          sfxCoin();
          items.splice(i,1);
        }
      }
    }
  }

  // やられ演出：くるっとひっくり返って落ちていく
  if(state === 'dying'){
    P.vy += GRAV*dt;
    P.y += P.vy*dt;
    deadTimer += dt;
    deadRot = Math.min(Math.PI, deadRot + 0.12*dt);
    if(P.y - P.h > H + 80 || deadTimer > 110){
      showGameOver();
    }
  }

  if(state === 'over' && newHigh){
    fwTimer -= dt;
    if(fwTimer <= 0){ firework(); fwTimer = 45; }
  }

  pops.forEach(p => { p.y -= 1.5*dt; p.life -= 0.02*dt; });
  pops = pops.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.05*dt; p.life -= 0.014*dt; });
  parts = parts.filter(p => p.life > 0);

  // --- 描画 ---
  const sky = ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#8ed4f7'); sky.addColorStop(1,'#cfeeff');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r*0.6, 0, 7);
    ctx.arc(c.x+c.r*0.6, c.y-c.r*0.25, c.r*0.5, 0, 7);
    ctx.arc(c.x+c.r*1.1, c.y, c.r*0.55, 0, 7);
    ctx.fill();
  });

  drawTerrain();
  drawItems();

  const frame = Math.floor(animT/2) % RUN_FRAMES;
  if(state === 'title'){
    drawRunner(homeX(), groundY, frame, false, false, 0);
  } else if(state === 'dying'){
    drawRunner(P.x, P.y, frame, true, true, deadRot);
  } else {
    drawRunner(P.x, P.y, frame, !P.ground, false, 0);
  }

  pops.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#c99400'; ctx.lineWidth = 3;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(p.t, p.x, p.y);
    ctx.fillText(p.t, p.x, p.y);
    ctx.globalAlpha = 1;
  });

  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
